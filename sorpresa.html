<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Una sorpresa para ti, María 💌</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --bg: #ffe9ee;
    --bg-glow: #ffc2d3;
    --fg: #4a1630;
    --muted: #8b4a66;
    --accent: #e0245e;
    --accent-soft: #ff7fa3;
    --paper: #fff8f1;
    --ink: #3b1226;
    --panel: rgba(255, 255, 255, 0.72);
    --shadow: 0 18px 40px rgba(224, 36, 94, 0.22);
    --script: "Caveat", "Segoe Script", "Bradley Hand", cursive;
    --sans: "Nunito", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #170a1d;
      --bg-glow: #47133a;
      --fg: #ffe7ef;
      --muted: #e3a9be;
      --accent: #ff5d8f;
      --accent-soft: #ffa3bd;
      --panel: rgba(255, 255, 255, 0.07);
      --shadow: 0 18px 44px rgba(0, 0, 0, 0.5);
    }
  }
  :root[data-theme="dark"] {
    --bg: #170a1d;
    --bg-glow: #47133a;
    --fg: #ffe7ef;
    --muted: #e3a9be;
    --accent: #ff5d8f;
    --accent-soft: #ffa3bd;
    --panel: rgba(255, 255, 255, 0.07);
    --shadow: 0 18px 44px rgba(0, 0, 0, 0.5);
  }

  *, *::before, *::after { box-sizing: inherit; }
  html { height: 100%; scroll-padding-top: env(safe-area-inset-top, 0px); }
  body {
    height: 100%;
    margin: 0;
    color: var(--fg);
    font-family: var(--sans);
    background-color: var(--bg);
    background-image: radial-gradient(ellipse at 50% 30%, var(--bg-glow) 0%, transparent 70%);
    overflow: hidden;
    -webkit-tap-highlight-color: transparent;
  }

  canvas { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #bg { z-index: 0; }
  #fx { z-index: 5; }

  .stage {
    position: relative;
    z-index: 1;
    height: 100%;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 22px;
    padding: 24px;
    text-align: center;
    overflow-y: auto;
  }
  .stage.active { display: flex; animation: appear 0.9s ease both; }
  @keyframes appear { from { opacity: 0; } to { opacity: 1; } }

  h1, h2 {
    font-family: var(--script);
    font-weight: 700;
    margin: 0;
    line-height: 1.05;
    letter-spacing: 0.01em;
  }
  h1 { font-size: clamp(2.6rem, 11vw, 4.4rem); }
  h2 { font-size: clamp(2.2rem, 9vw, 3.4rem); }
  p { margin: 0; }
  .hint { color: var(--muted); font-size: 1rem; }

  button {
    font: inherit;
    cursor: pointer;
    border: 0;
    color: #fff;
    background: var(--accent);
    padding: 14px 28px;
    border-radius: 999px;
    font-weight: 800;
    font-size: 1.05rem;
    box-shadow: var(--shadow);
    transition: transform 0.2s ease, filter 0.2s ease;
  }
  button:hover { filter: brightness(1.08); }
  button:active { transform: scale(0.96); }
  button:focus-visible, .envelope:focus-visible { outline: 3px solid var(--accent-soft); outline-offset: 4px; }
  button.ghost { background: transparent; color: var(--muted); box-shadow: none; font-weight: 700; }

  /* ---------- Sobre ---------- */
  .envelope {
    position: relative;
    width: min(300px, 78vw);
    aspect-ratio: 300 / 200;
    border: 0;
    padding: 0;
    background: none;
    box-shadow: none;
    border-radius: 0;
    perspective: 900px;
    animation: bob 3.2s ease-in-out infinite;
  }
  .envelope.open { animation: none; }
  @keyframes bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
  .env-back, .env-front, .env-flap, .env-letter { position: absolute; left: 0; right: 0; }
  .env-back { inset: 0; background: #c81f55; border-radius: 10px; box-shadow: var(--shadow); }
  .env-letter {
    left: 7%; right: 7%; bottom: 6%; height: 78%;
    background: var(--paper);
    border-radius: 6px;
    transition: transform 0.9s cubic-bezier(.2,.8,.2,1) 0.5s;
    display: flex; align-items: center; justify-content: center;
    font-family: var(--script); font-size: 1.9rem; color: var(--ink);
  }
  .envelope.open .env-letter { transform: translateY(-62%); }
  .env-front {
    bottom: 0; height: 100%;
    background: #e0306a;
    clip-path: polygon(0 0, 50% 52%, 100% 0, 100% 100%, 0 100%);
    border-radius: 10px;
  }
  .env-flap {
    top: 0; height: 56%;
    background: #f0457c;
    clip-path: polygon(0 0, 100% 0, 50% 100%);
    transform-origin: top center;
    transition: transform 0.7s ease;
    z-index: 3;
  }
  .envelope.open .env-flap { transform: rotateX(180deg); }
  .seal {
    position: absolute; z-index: 4; left: 50%; top: 44%;
    transform: translate(-50%, -50%);
    font-size: 2rem;
    transition: opacity 0.3s ease;
    filter: drop-shadow(0 3px 6px rgba(0,0,0,.35));
  }
  .envelope.open .seal { opacity: 0; }

  /* ---------- Carta ---------- */
  .paper {
    width: min(540px, 100%);
    background: var(--paper);
    color: var(--ink);
    border-radius: 8px;
    padding: 32px 28px 30px;
    box-shadow: var(--shadow);
    text-align: left;
    background-image: repeating-linear-gradient(transparent 0 37px, rgba(224, 36, 94, 0.16) 37px 38px);
    transform: rotate(-1deg);
  }
  #letter {
    font-family: var(--script);
    font-size: clamp(1.55rem, 5.6vw, 2rem);
    line-height: 38px;
    white-space: pre-wrap;
    min-height: 200px;
  }
  .caret { display: inline-block; width: 2px; height: 1.1em; background: var(--accent); vertical-align: -0.15em; margin-left: 2px; animation: blink 0.9s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }

  /* ---------- Razones ---------- */
  .reason {
    width: min(460px, 100%);
    min-height: 210px;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
    padding: 30px 26px;
    background: var(--panel);
    border: 1px solid color-mix(in srgb, var(--accent) 30%, transparent);
    border-radius: 28px;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    box-shadow: var(--shadow);
  }
  .reason .count { color: var(--muted); font-weight: 700; font-size: 0.95rem; }
  .reason .text { font-family: var(--script); font-size: clamp(1.9rem, 7vw, 2.5rem); line-height: 1.15; }
  .reason.swap { animation: pop 0.5s cubic-bezier(.2,1.2,.4,1) both; }
  @keyframes pop { from { opacity: 0; transform: scale(0.92) rotate(-2deg); } to { opacity: 1; transform: none; } }

  /* ---------- Pregunta ---------- */
  .arena { position: relative; width: min(420px, 100%); height: 190px; }
  .arena #yes { position: absolute; left: 50%; top: 34px; transform: translateX(-50%); z-index: 2; transition: transform 0.3s ease; }
  .arena #no {
    position: absolute; left: 50%; top: 130px; transform: translateX(-50%);
    background: var(--panel); color: var(--fg); box-shadow: none;
    border: 1px solid color-mix(in srgb, var(--fg) 25%, transparent);
    padding: 10px 20px; font-size: 0.95rem; white-space: nowrap; z-index: 1;
    transition: left 0.25s ease, top 0.25s ease;
  }

  /* ---------- Final ---------- */
  .big-heart { font-size: clamp(4rem, 20vw, 6.5rem); animation: beat 1.2s ease-in-out infinite; filter: drop-shadow(0 8px 18px rgba(224, 36, 94, 0.5)); }
  @keyframes beat { 0%, 100% { transform: scale(1); } 15% { transform: scale(1.18); } 30% { transform: scale(1); } 45% { transform: scale(1.12); } }
  .signature { font-family: var(--script); font-size: 2rem; color: var(--accent); }

  @media (prefers-reduced-motion: reduce) {
    .envelope, .big-heart { animation: none; }
    .stage.active { animation: none; }
  }
</style>
</head>
<body>
<canvas id="bg" aria-hidden="true"></canvas>
<canvas id="fx" aria-hidden="true"></canvas>

<!-- 1. Sobre -->
<section class="stage active" id="s-intro">
  <h1>María, tengo<br>algo para ti</h1>
  <button class="envelope" id="envelope" aria-label="Abrir el sobre">
    <div class="env-back"></div>
    <div class="env-letter">para María ♥</div>
    <div class="env-front"></div>
    <div class="env-flap"></div>
    <div class="seal">❤️</div>
  </button>
  <p class="hint">Toca el sobre para abrirlo</p>
</section>

<!-- 2. Carta -->
<section class="stage" id="s-carta">
  <div class="paper" id="paper" title="Toca para ver la carta completa">
    <div id="letter"></div>
  </div>
  <button id="toReasons" hidden>Sigue leyendo</button>
</section>

<!-- 3. Razones -->
<section class="stage" id="s-razones">
  <h2>Cosas que pienso de ti</h2>
  <div class="reason" id="reason">
    <div class="count" id="rCount"></div>
    <div class="text" id="rText"></div>
  </div>
  <button id="rNext">Siguiente</button>
</section>

<!-- 4. Pregunta -->
<section class="stage" id="s-pregunta">
  <h2>Una última pregunta…</h2>
  <p class="hint" style="font-size:1.25rem">María, ¿me dejas seguir siendo tu persona favorita?</p>
  <div class="arena" id="arena">
    <button id="yes">Sí, claro 💖</button>
    <button id="no">No</button>
  </div>
</section>

<!-- 5. Final -->
<section class="stage" id="s-final">
  <div class="big-heart">❤️</div>
  <h1>Feliz Día del<br>Amor y la Amistad</h1>
  <p class="hint" style="font-size:1.2rem; max-width: 30ch">Gracias por existir en mi vida, María. De verdad.</p>
  <p class="signature">Con todo mi cariño, tu novio</p>
  <button class="ghost" id="again">Ver otra vez</button>
</section>

<script>
(function () {
  var $ = function (id) { return document.getElementById(id); };
  var reduce = window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  /* ================= Sonido suave (opcional) ================= */
  var audioCtx = null;
  function chime(notes, step) {
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      audioCtx = audioCtx || new AC();
      if (audioCtx.state === "suspended") audioCtx.resume();
      var t0 = audioCtx.currentTime;
      notes.forEach(function (f, i) {
        var o = audioCtx.createOscillator(), g = audioCtx.createGain(), t = t0 + i * (step || 0.16);
        o.type = "sine"; o.frequency.value = f;
        g.gain.setValueAtTime(0.0001, t);
        g.gain.linearRampToValueAtTime(0.14, t + 0.02);
        g.gain.exponentialRampToValueAtTime(0.0001, t + 1.0);
        o.connect(g); g.connect(audioCtx.destination);
        o.start(t); o.stop(t + 1.1);
      });
    } catch (e) {}
  }

  /* ================= Canvas: corazones de fondo + confeti ================= */
  var bg = $("bg"), bctx = bg.getContext("2d");
  var fx = $("fx"), fctx = fx.getContext("2d");
  var W = 0, H = 0, dpr = Math.min(window.devicePixelRatio || 1, 2);
  function resize() {
    W = window.innerWidth; H = window.innerHeight;
    [bg, fx].forEach(function (c) { c.width = W * dpr; c.height = H * dpr; });
    bctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    fctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  window.addEventListener("resize", resize); resize();

  var hearts = [];
  var count = reduce ? 10 : 26;
  for (var i = 0; i < count; i++) {
    hearts.push({
      x: Math.random() * W, y: Math.random() * H,
      s: 12 + Math.random() * 26, v: 0.25 + Math.random() * 0.7,
      ph: Math.random() * 6.28, a: 0.10 + Math.random() * 0.22
    });
  }
  var confetti = [];
  var symbols = ["❤️", "💖", "💗", "✨", "🌸", "💕"];
  function burst(x, y, n) {
    for (var k = 0; k < n; k++) {
      var ang = Math.random() * Math.PI * 2, sp = 3 + Math.random() * 8;
      confetti.push({
        x: x, y: y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp - 5,
        s: 16 + Math.random() * 20, r: Math.random() * 6, vr: (Math.random() - 0.5) * 0.3,
        ch: symbols[Math.floor(Math.random() * symbols.length)], life: 1
      });
    }
  }
  function rain(n) {
    for (var k = 0; k < n; k++) {
      confetti.push({
        x: Math.random() * W, y: -20 - Math.random() * H * 0.6,
        vx: (Math.random() - 0.5) * 1.5, vy: 1.5 + Math.random() * 2.5,
        s: 16 + Math.random() * 20, r: 0, vr: (Math.random() - 0.5) * 0.1,
        ch: symbols[Math.floor(Math.random() * symbols.length)], life: 1, rain: true
      });
    }
  }
  function frame(t) {
    bctx.clearRect(0, 0, W, H);
    var accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#e0245e";
    hearts.forEach(function (h) {
      h.y -= h.v; if (h.y < -40) { h.y = H + 40; h.x = Math.random() * W; }
      var x = h.x + Math.sin(t / 1400 + h.ph) * 18;
      bctx.globalAlpha = h.a; bctx.fillStyle = accent;
      bctx.font = h.s + "px serif"; bctx.fillText("♥", x, h.y);
    });
    bctx.globalAlpha = 1;

    fctx.clearRect(0, 0, W, H);
    for (var i = confetti.length - 1; i >= 0; i--) {
      var p = confetti[i];
      p.x += p.vx; p.y += p.vy;
      if (!p.rain) { p.vy += 0.22; p.vx *= 0.99; p.life -= 0.008; } else { p.life -= 0.0025; }
      p.r += p.vr;
      if (p.life <= 0 || p.y > H + 40) { confetti.splice(i, 1); continue; }
      fctx.save();
      fctx.globalAlpha = Math.max(0, Math.min(1, p.life * 1.5));
      fctx.translate(p.x, p.y); fctx.rotate(p.r);
      fctx.font = p.s + "px serif"; fctx.textAlign = "center"; fctx.textBaseline = "middle";
      fctx.fillText(p.ch, 0, 0);
      fctx.restore();
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);

  /* ================= Navegación entre escenas ================= */
  var stages = document.querySelectorAll(".stage");
  function go(id) {
    stages.forEach(function (s) { s.classList.toggle("active", s.id === id); });
  }

  /* ---- 1. Sobre ---- */
  var env = $("envelope");
  env.addEventListener("click", function () {
    if (env.classList.contains("open")) return;
    env.classList.add("open");
    chime([523, 659, 784, 1047], 0.14);
    var r = env.getBoundingClientRect();
    if (!reduce) burst(r.left + r.width / 2, r.top + r.height / 2, 22);
    setTimeout(function () { go("s-carta"); startLetter(); }, 2100);
  });

  /* ---- 2. Carta ---- */
  var LETTER =
    "Hola, María, mi amor 💌\n\n" +
    "Hoy es el Día del Amor y la Amistad y quise hacer algo distinto a un mensaje normal.\n\n" +
    "Así que te armé esto con mis propias manos (y un poquito de código).\n\n" +
    "Gracias por estar, por aguantarme, por hacerme reír y por ser la persona que hace que los días pesados se sientan livianos.\n\n" +
    "Ojalá esto te saque una sonrisa. Con eso me doy por bien pagado.\n\n" +
    "Te quiero mucho, mi amor ❤️";
  var typing = null, typed = 0;
  var letterEl = $("letter"), moreBtn = $("toReasons");
  function render(n) {
    letterEl.textContent = LETTER.slice(0, n);
    var c = document.createElement("span"); c.className = "caret"; letterEl.appendChild(c);
  }
  function finishLetter() {
    clearInterval(typing); typing = null; typed = LETTER.length;
    letterEl.textContent = LETTER; moreBtn.hidden = false;
  }
  function startLetter() {
    typed = 0; moreBtn.hidden = true; render(0);
    if (reduce) { finishLetter(); return; }
    typing = setInterval(function () {
      typed++; render(typed);
      if (typed >= LETTER.length) finishLetter();
    }, 38);
  }
  $("paper").addEventListener("click", function () { if (typing) finishLetter(); });
  moreBtn.addEventListener("click", function () { go("s-razones"); showReason(0); });

  /* ---- 3. Razones ---- */
  var REASONS = [
    "Contigo hasta lo más normal se vuelve un buen plan.",
    "Tu risa es de mis sonidos favoritos.",
    "Contigo puedo ser yo, sin filtros ni actuaciones.",
    "Me arreglas el día más rápido de lo que yo arreglo una pantalla rota 😄",
    "Y sobre todo: porque eres tú, María."
  ];
  var ri = 0, rBox = $("reason");
  function showReason(i) {
    ri = i;
    $("rCount").textContent = "Razón " + (i + 1) + " de " + REASONS.length;
    $("rText").textContent = REASONS[i];
    $("rNext").textContent = i === REASONS.length - 1 ? "Continuar" : "Siguiente";
    rBox.classList.remove("swap"); void rBox.offsetWidth; rBox.classList.add("swap");
    chime([392 + i * 40, 587 + i * 40], 0.12);
  }
  $("rNext").addEventListener("click", function () {
    if (ri < REASONS.length - 1) showReason(ri + 1); else go("s-pregunta");
  });

  /* ---- 4. Pregunta (el "No" se escapa) ---- */
  var arena = $("arena"), no = $("no"), yes = $("yes"), tries = 0;
  var NO_TEXT = ["No", "¿Segura? 🥺", "Piénsalo bien…", "Ni lo intentes 😏", "Mejor di que sí ❤️", "Ya ríndete 😂"];
  function dodge(e) {
    if (e) e.preventDefault();
    tries++;
    var a = arena.getBoundingClientRect(), b = no.getBoundingClientRect();
    var maxX = Math.max(0, a.width - b.width), maxY = Math.max(0, a.height - b.height);
    no.style.transform = "none";
    no.style.left = Math.random() * maxX + "px";
    no.style.top = Math.max(90, Math.random() * maxY) + "px";
    no.textContent = NO_TEXT[Math.min(tries, NO_TEXT.length - 1)];
    yes.style.transform = "translateX(-50%) scale(" + (1 + Math.min(tries, 8) * 0.1) + ")";
  }
  no.addEventListener("mouseenter", dodge);
  no.addEventListener("touchstart", dodge, { passive: false });
  no.addEventListener("click", dodge);
  yes.addEventListener("click", function () {
    go("s-final");
    chime([523, 659, 784, 1047, 1319], 0.13);
    burst(W / 2, H / 2, 60);
    if (!reduce) setTimeout(function () { rain(40); }, 400);
  });

  /* ---- 5. Final ---- */
  $("again").addEventListener("click", function () {
    tries = 0; no.textContent = "No"; no.removeAttribute("style"); yes.removeAttribute("style");
    env.classList.remove("open"); go("s-intro");
  });
})();
</script>
</body>
</html>
